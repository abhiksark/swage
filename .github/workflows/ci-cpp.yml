# .github/workflows/ci-cpp.yml
name: ci-cpp

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    # The first run after the LLVM pin, its tarball digest,
    # scripts/build_llvm.sh, or the runner image changes builds LLVM from
    # source (~3h); afterwards the install tree is cached and the job takes
    # minutes.
    timeout-minutes: 350
    permissions:
      contents: read
      security-events: write
    env:
      SWAGE_LLVM_HOME: /home/runner/.swage/llvm
      # Only LLVM is cached: Swage must compile afresh for CodeQL capture.
      CCACHE_DISABLE: "1"
      CC: gcc
      CXX: g++
    outputs:
      llvm-tag: ${{ steps.pin.outputs.tag }}
      llvm-cache-key: ${{ steps.pin.outputs.cache-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The key names everything the cached install tree was built from: the
      # runner image, the pin, the build script, and the digest of the
      # source tarball. The fixed middle part names the build type and the
      # Python version of the bindings; change it by hand when those change.
      - name: Read LLVM pin
        id: pin
        env:
          LLVM_BUILD_INPUTS: ${{ hashFiles('scripts/build_llvm.sh', 'cmake/llvm-source-sha256.txt') }}
        run: |
          tag="$(cat cmake/llvm-version.txt)"
          image="${ImageOS:-unknown-image}"
          key="llvm-$RUNNER_OS-$image-$tag-release-py313-bindings-v2-gtest-v1"
          echo "SWAGE_BUILD_DIR=$RUNNER_TEMP/native-build" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "cache-key=$key-$LLVM_BUILD_INPUTS" >> "$GITHUB_OUTPUT"

      - name: Cache LLVM install tree
        id: llvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.swage/llvm/install-${{ steps.pin.outputs.tag }}
          key: ${{ steps.pin.outputs.cache-key }}

      - name: Free runner disk space (LLVM build only)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          df -h /

      - name: Fetch Python binding requirements (cache miss only)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/fetch_llvm.sh
          mkdir -p "$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}"
          cp "$SWAGE_LLVM_HOME/src-${{ steps.pin.outputs.tag }}/mlir/python/requirements.txt" \
             "$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}/python-requirements.txt"

      # requirements-ci.txt pins pytest, lit, ninja, and the MLIR binding
      # requirements by hash. The second command then installs the list that
      # the pinned LLVM release ships. The lock already satisfies every entry
      # except PyYAML, which that list caps at a version without a Python
      # 3.13 wheel, so PyYAML alone is built from source without a hash.
      - name: Install Python binding test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install \
            -r "$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}/python-requirements.txt"

      - name: Install current PyTorch CPU dependency
        run: >
          python -m pip install torch==2.13.0+cpu
          --index-url https://download.pytorch.org/whl/cpu/

      - name: Build pinned LLVM/MLIR (cache miss only)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          SWAGE_LLVM_BUILD_TYPE=Release SWAGE_LLVM_PYTHON_BINDINGS=ON \
            SWAGE_PYTHON_EXECUTABLE="$(command -v python)" ./scripts/build_llvm.sh
          rm -rf "$SWAGE_LLVM_HOME/src-${{ steps.pin.outputs.tag }}" \
                 "$SWAGE_LLVM_HOME/build-${{ steps.pin.outputs.tag }}" \
                 "$SWAGE_LLVM_HOME"/*.tar.xz

      - name: Initialize CodeQL C/C++
        id: codeql-init
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build Swage and run lit suite
        run: SWAGE_BUILD_TYPE=Release ./scripts/build_swage.sh

      - name: Build MLIR documentation
        run: >
          ninja -C "$SWAGE_BUILD_DIR"
          SwageDialectDocGen
          SwageOpsDocGen
          SwagePlanDialectDocGen
          SwagePlanOpsDocGen

      - name: Check committed MLIR reference
        run: python scripts/sync_mlir_reference.py --build-dir "$SWAGE_BUILD_DIR" --check

      - name: Run C++ unit tests
        run: ninja -C "$SWAGE_BUILD_DIR" check-swage-unit

      - name: Run Python binding integration tests
        run: ninja -C "$SWAGE_BUILD_DIR" check-swage-python

      # The build backend and nanobind come from the hash lock installed
      # above, so the build runs without isolation.
      - name: Build local cp313 native wheel
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python -m build --wheel --no-isolation \
            --outdir "$RUNNER_TEMP/native-wheelhouse" \
            -Ccmake.define.SWAGE_SOURCE_REVISION="$GITHUB_SHA" \
            -Ccmake.define.SWAGE_SOURCE_CLEAN=true \
            -Ccmake.define.MLIR_DIR="$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}/lib/cmake/mlir" \
            -Ccmake.define.LLVM_DIR="$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}/lib/cmake/llvm" \
            -Cbuild-dir="$RUNNER_TEMP/native-wheel-build"

      - name: Install local wheel into fresh environment
        run: |
          # Share only dependencies such as CPU Torch; Swage is installed anew.
          python -m venv --system-site-packages "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps --ignore-installed \
            "$RUNNER_TEMP/native-wheelhouse/"swage_compiler-*-cp313-cp313-linux_x86_64.whl

      - name: Check installed CPU wheel outside checkout
        working-directory: ${{ runner.temp }}
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          unset PYTHONPATH
          "$RUNNER_TEMP/wheel-venv/bin/python" -m swage.env --json --check cpu
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest --import-mode=importlib \
            --rootdir "$RUNNER_TEMP" \
            "$GITHUB_WORKSPACE/python/tests/mlir/test_cpu_runtime.py" \
            "$GITHUB_WORKSPACE/python/tests/mlir/test_low_precision_runtime.py" \
            "$GITHUB_WORKSPACE/python/tests/mlir/test_operation_dispatch.py" -q
          "$RUNNER_TEMP/wheel-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py" \
            --backend cpu --expected-revision "$GITHUB_SHA"

      # The whole native suite runs against the installed wheel, from a copy
      # of the tests and of the repository files they read, so only the
      # installed packages can be imported. The private CPU oracle runs
      # swage-opt and the LLVM runner, which the wheel does not hold, so
      # SWAGE_ORACLE_BUILD_DIR names the build of this job for its tools.
      # Every CUDA test skips on this runner.
      - name: Run the native suite against the installed wheel
        working-directory: ${{ runner.temp }}
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          unset PYTHONPATH
          python="$RUNNER_TEMP/wheel-venv/bin/python"
          proof="$RUNNER_TEMP/wheel-proof"
          mkdir -p "$proof/python/tests" "$proof/cmake" "$proof/docs/internals" \
            "$proof/benchmarks"
          cp -r "$GITHUB_WORKSPACE/python/tests/mlir" "$proof/python/tests/mlir"
          cp -r "$GITHUB_WORKSPACE/examples" "$GITHUB_WORKSPACE/test" "$proof/"
          cp "$GITHUB_WORKSPACE/cmake/llvm-version.txt" "$proof/cmake/"
          cp "$GITHUB_WORKSPACE/docs/internals/segmented-reductions.md" \
            "$proof/docs/internals/"
          cp "$GITHUB_WORKSPACE/benchmarks/distributions.py" "$proof/benchmarks/"
          export SWAGE_ORACLE_BUILD_DIR="$SWAGE_BUILD_DIR"
          cd "$proof"
          "$python" - "$GITHUB_SHA" <<'PY'
          import pathlib
          import sys

          import swage
          from swage import env

          report = env.report()
          installed = pathlib.Path(sys.prefix)
          native = report["native"]
          bindings = native["bindings"]
          for path in (report["source"]["file"], bindings["file"]):
              assert pathlib.Path(path).is_relative_to(installed), report
          assert native["available"], report
          assert native["source_revision"] == sys.argv[1], report
          assert native["source_clean"] is True, report
          assert bindings["version"] == swage.__version__, report
          assert bindings["revision"] == sys.argv[1], report
          assert bindings["llvm_linked"], report
          PY
          "$python" examples/emit_fixed_vector_add.py
          "$python" -m pytest -q -p no:cacheprovider python/tests/mlir

      - name: Analyze CodeQL C/C++
        if: ${{ !cancelled() && steps.codeql-init.outcome == 'success' }}
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:c-cpp

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # clang-format versions format differently, so the check uses the
      # version pinned in requirements-ci.txt.
      - name: Install hash-locked tools
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Check C and C++ formatting
        run: |
          clang-format --version
          git ls-files -z '*.c' '*.cpp' '*.h' \
            | xargs -0 -r clang-format --dry-run --Werror

  # AddressSanitizer and UndefinedBehaviorSanitizer over the Swage targets,
  # linked against the cached Release LLVM, which is not instrumented. The
  # Python bindings are left out: an instrumented extension does not load
  # into an uninstrumented interpreter.
  sanitizers:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
      # abort_on_error makes a report a crash, so a test that expects
      # swage-opt to fail cannot pass on a sanitizer report. Each runtime
      # reads its own variable, so both set it.
      # allow_user_poisoning=0 ignores the manual poisoning in LLVM's bump
      # allocator. Its inline functions are instrumented in Swage objects and
      # not in the LLVM libraries, so with poisoning honored every MLIR
      # context reports a use-after-poison that is not a defect.
      ASAN_OPTIONS: abort_on_error=1:allow_user_poisoning=0
      UBSAN_OPTIONS: abort_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # build-and-test saved or restored this entry before this job started.
      - name: Restore LLVM install tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.swage/llvm/install-${{ needs.build-and-test.outputs.llvm-tag }}
          key: ${{ needs.build-and-test.outputs.llvm-cache-key }}
          fail-on-cache-miss: true

      - name: Install hash-locked tools
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Configure Swage with sanitizers
        env:
          LLVM_INSTALL: /home/runner/.swage/llvm/install-${{ needs.build-and-test.outputs.llvm-tag }}
          SANITIZER_FLAGS: >-
            -fsanitize=address,undefined
            -fno-sanitize=vptr
            -fno-sanitize-recover=all
            -fno-omit-frame-pointer
        run: |
          cmake -G Ninja -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMLIR_DIR="$LLVM_INSTALL/lib/cmake/mlir" \
            -DLLVM_DIR="$LLVM_INSTALL/lib/cmake/llvm" \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DSWAGE_PYTHON_BINDINGS=OFF \
            -DCMAKE_C_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS"

      - name: Build Swage with sanitizers
        run: ninja -C build-sanitize

      # A build that dropped the flags would pass every test below.
      - name: Require instrumented binaries
        run: |
          nm build-sanitize/bin/swage-opt > "$RUNNER_TEMP/swage-opt-symbols.txt"
          grep -q __asan_init "$RUNNER_TEMP/swage-opt-symbols.txt"
          grep -q __ubsan_handle "$RUNNER_TEMP/swage-opt-symbols.txt"

      - name: Run lit suite under sanitizers
        run: ninja -C build-sanitize check-swage

      - name: Run C++ unit tests under sanitizers
        run: ninja -C build-sanitize check-swage-unit
