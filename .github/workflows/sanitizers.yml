# .github/workflows/sanitizers.yml
name: sanitizers

# AddressSanitizer and UndefinedBehaviorSanitizer over Swage linked against
# an LLVM built with the same sanitizers, so a finding inside an LLVM call
# is reported too. Building that LLVM takes about 350 minutes on a cache
# miss, so this runs on pushes to main and once a week, not on pull
# requests. Pull requests run the `sanitizers` job of ci-cpp, which
# instruments Swage alone against the cached Release LLVM.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers-instrumented-llvm:
    name: Native ASan + UBSan (instrumented LLVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      SWAGE_LLVM_HOME: /home/runner/.swage/llvm-sanitizers
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:abort_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Read LLVM pin
        id: pin
        run: |
          tag="$(cat cmake/llvm-version.txt)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache sanitizer-matched LLVM install
        id: llvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.swage/llvm-sanitizers/install-${{ steps.pin.outputs.tag }}
          key: llvm-ubuntu24-${{ steps.pin.outputs.tag }}-clang18-asan-ubsan-v1

      - name: Free runner disk space (LLVM build only)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          df -h /

      # lit and ninja come from the hash lock.
      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev
          python -m pip install --require-hashes -r requirements-ci.txt

      - name: Build sanitizer-matched LLVM (cache miss only)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/fetch_llvm.sh
          SWAGE_LLVM_BUILD_TYPE=Release SWAGE_LLVM_PYTHON_BINDINGS=OFF \
            SWAGE_LLVM_TARGETS='X86;NVPTX' \
            SWAGE_LLVM_SANITIZERS='Address;Undefined' \
            ./scripts/build_llvm.sh
          rm -rf "$SWAGE_LLVM_HOME/src-${{ steps.pin.outputs.tag }}" \
                 "$SWAGE_LLVM_HOME/build-${{ steps.pin.outputs.tag }}" \
                 "$SWAGE_LLVM_HOME"/*.tar.xz

      - name: Configure bindings-off ASan and UBSan build
        run: |
          cmake -G Ninja -S "$GITHUB_WORKSPACE" -B "$RUNNER_TEMP/sanitizer-build" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMLIR_DIR="$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}/lib/cmake/mlir" \
            -DLLVM_DIR="$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}/lib/cmake/llvm" \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DSWAGE_PYTHON_BINDINGS=OFF \
            -DSWAGE_ENABLE_SANITIZERS=ON
          echo "ASAN_SYMBOLIZER_PATH=$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}/bin/llvm-symbolizer" >> "$GITHUB_ENV"
          echo "UBSAN_SYMBOLIZER_PATH=$SWAGE_LLVM_HOME/install-${{ steps.pin.outputs.tag }}/bin/llvm-symbolizer" >> "$GITHUB_ENV"

      - name: Build Swage with sanitizers
        run: ninja -C "$RUNNER_TEMP/sanitizer-build"

      # A build that dropped the flags would pass every test below.
      - name: Require instrumented binaries
        run: |
          nm "$RUNNER_TEMP/sanitizer-build/bin/swage-opt" \
            > "$RUNNER_TEMP/swage-opt-symbols.txt"
          grep -q __asan_init "$RUNNER_TEMP/swage-opt-symbols.txt"
          grep -q __ubsan_handle "$RUNNER_TEMP/swage-opt-symbols.txt"

      - name: Run sanitizer lit and C++ unit tests
        run: ninja -C "$RUNNER_TEMP/sanitizer-build" check-swage check-swage-unit
