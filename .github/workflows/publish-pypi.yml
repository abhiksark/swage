# .github/workflows/publish-pypi.yml

name: publish-pypi

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The pure-Python tier runs in a checkout of its own, so nothing the tests
  # write can reach the released files. A failure here stops the build and
  # with it the publish job.
  python-tier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install hash-locked tools
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python -m pytest tests/python -q

  build:
    needs: python-tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # build, twine, and the build backend come from the hash-locked set.
      - name: Install build tools
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Verify source and package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          checked_out="$(git rev-parse HEAD)"
          package_version="$(
            PYTHONPATH=python python -c \
              'import swage; print(swage.__version__)'
          )"
          test "$checked_out" = "$GITHUB_SHA"
          if test "$EVENT_NAME" = "push"; then
            test "$REF_TYPE" = "tag"
            test "$REF_NAME" = "v$package_version"
            test "$(git cat-file -t "$REF_NAME")" = "tag"
            test "$(git rev-parse "$REF_NAME^{commit}")" = "$checked_out"
          fi
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Check distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/swage-compiler
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
