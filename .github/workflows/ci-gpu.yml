# .github/workflows/ci-gpu.yml
name: ci-gpu

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-gpu-main
  cancel-in-progress: false

jobs:
  runtime-qualification:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, swage-gpu]
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/build/python_packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure trusted runner paths
        run: |
          echo "SWAGE_LLVM_HOME=$HOME/.swage/llvm" >> "$GITHUB_ENV"
          cache_dir="$RUNNER_TEMP/swage-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "SWAGE_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Require CUDA and the trusted runner toolchain
        run: |
          python - <<'PY'
          import torch

          assert torch.cuda.is_available(), "trusted GPU runner has no CUDA"
          print(f"PyTorch: {torch.__version__} (CUDA {torch.version.cuda})")
          print(f"GPU: {torch.cuda.get_device_name()}")
          print(f"compute capability: {torch.cuda.get_device_capability()}")
          PY
          cmake --version
          ninja --version
          lit --version

      - name: Build native bindings and run CPU qualification
        run: SWAGE_BUILD_TYPE=Release ./scripts/build_swage.sh

      - name: Test cache validation
        run: |
          python -m pytest -q \
            tests/python/test_runtime.py::test_cache_round_trip_and_corruption_rejection \
            tests/python/test_runtime.py::test_cache_rejects_unsafe_entries

      # The whole directory, not a list of files: every CUDA-gated test,
      # including any file added later, runs on this runner. Hosted CI has
      # no GPU and skips those tests.
      - name: Test CUDA correctness, streams, and process reuse
        run: python -m pytest -q python/tests/mlir

      - name: Run the documented fixed vector-add walkthrough
        run: |
          SWAGE_DUMP_DIR="$RUNNER_TEMP/swage-example-dumps" \
          SWAGE_DUMP_MLIR=1 SWAGE_DUMP_PTX=1 \
          python examples/fixed_vector_add.py
          test -n "$(find "$RUNNER_TEMP/swage-example-dumps" -type f -name '*.mlir' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/swage-example-dumps" -type f -name '*.ptx' -print -quit)"

      # Fresh processes share a cache directory of their own: the first must
      # compile once and publish one entry, the second must compile nothing
      # and read that entry under the same key. A skipped case observes no
      # reuse, so a skip fails the step.
      - name: Test persistent cache reuse in a new process
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            python/tests/mlir/test_cache_process_reuse.py \
            | tee "$RUNNER_TEMP/cache-process-reuse.txt"
          if grep -qi skipped "$RUNNER_TEMP/cache-process-reuse.txt"; then
            echo "a cache reuse case was skipped" >&2
            exit 1
          fi

  fixed-runtime-slo:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, swage-gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build isolated fixed-runtime wheel
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/swage-fixed-runtime-$GITHUB_RUN_ID"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python -m venv --system-site-packages "$work/venv"
          py="$work/venv/bin/python"
          # The build tools come from the hash lock, so the build runs
          # without isolation.
          "$py" -m pip install --require-hashes -r requirements-ci.txt
          pin="$(cat cmake/llvm-version.txt)"
          llvm="$HOME/.swage/llvm/install-$pin"
          "$py" -m build --wheel --no-isolation --outdir "$work/dist" \
            -Cbuild-dir="$work/build" \
            -Ccmake.define.MLIR_DIR="$llvm/lib/cmake/mlir" \
            -Ccmake.define.LLVM_DIR="$llvm/lib/cmake/llvm" \
            -Ccmake.define.SWAGE_SOURCE_REVISION="$GITHUB_SHA" \
            -Ccmake.define.SWAGE_SOURCE_CLEAN=true
          "$py" -m pip install --no-deps --ignore-installed "$work"/dist/*.whl
          echo "FIXED_WORK=$work" >> "$GITHUB_ENV"
      - name: Check installed CUDA boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$FIXED_WORK/venv/bin/python" -m swage.env --json --check cuda
          env -u PYTHONPATH "$FIXED_WORK/venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py" \
            --backend cuda --expected-revision "$GITHUB_SHA"
      - name: Enforce fixed-runtime A6000 SLOs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$FIXED_WORK/venv/bin/python" \
            -m swage.bench vector-add \
            --enforce --output "$RUNNER_TEMP/fixed-runtime-slo.json"
      - name: Retain raw SLO evidence on failure
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: fixed-runtime-slo
          path: ${{ runner.temp }}/fixed-runtime-slo.json
