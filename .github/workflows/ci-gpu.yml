# .github/workflows/ci-gpu.yml
name: ci-gpu

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-gpu-main
  cancel-in-progress: false

jobs:
  runtime-qualification:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, swage-gpu]
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/build/python_packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure trusted runner paths
        run: |
          echo "SWAGE_LLVM_HOME=$HOME/.swage/llvm" >> "$GITHUB_ENV"
          cache_dir="$RUNNER_TEMP/swage-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "SWAGE_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: Require CUDA and the trusted runner toolchain
        run: |
          python - <<'PY'
          import torch

          assert torch.cuda.is_available(), "trusted GPU runner has no CUDA"
          print(f"PyTorch: {torch.__version__} (CUDA {torch.version.cuda})")
          print(f"GPU: {torch.cuda.get_device_name()}")
          print(f"compute capability: {torch.cuda.get_device_capability()}")
          PY
          cmake --version
          ninja --version
          lit --version

      - name: Build native bindings and run CPU qualification
        run: SWAGE_BUILD_TYPE=Release ./scripts/build_swage.sh

      - name: Test cache validation
        run: |
          python -m pytest -q \
            tests/python/test_runtime.py::test_cache_round_trip_and_corruption_rejection \
            tests/python/test_runtime.py::test_cache_rejects_unsafe_entries

      - name: Test CUDA correctness, streams, and process reuse
        run: |
          python -m pytest -q \
            python/tests/mlir/test_runtime.py \
            python/tests/mlir/test_segmented_runtime.py

      - name: Run the documented fixed vector-add walkthrough
        run: |
          SWAGE_DUMP_DIR="$RUNNER_TEMP/swage-example-dumps" \
          SWAGE_DUMP_MLIR=1 SWAGE_DUMP_PTX=1 \
          python examples/fixed_vector_add.py
          test -n "$(find "$RUNNER_TEMP/swage-example-dumps" -type f -name '*.mlir' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/swage-example-dumps" -type f -name '*.ptx' -print -quit)"

      - name: Test persistent cache reuse in a new process
        run: |
          test -n "$(find "$SWAGE_CACHE_DIR" -name kernel.ptx -type f -print -quit)"
          python -m pytest -q \
            'python/tests/mlir/test_runtime.py::test_vector_add_matches_pytorch[129]'
