<!-- docs/assets/diagrams/compiler-journey.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 900"
     role="img"
     aria-labelledby="title description">
  <title id="title">The implemented and planned Swage compiler journeys</title>
  <desc id="description">
    The public fixed vector-add path travels from a Python jit kernel through
    Swage MLIR, standard MLIR and LLVM NVPTX lowering, PTX, and the CUDA Driver
    on the current PyTorch stream. Private segmented qualification starts from
    canonical modules. M4 and M5 branch to a CPU oracle or one-CTA GPU path,
    M6 produces a plan without launching, and M7 and M8 consume that plan for
    direct or split identity-sum execution. Public segmented syntax and launch
    remain planned.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
    <style>
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #17212B;
      }
      .title { font-size: 36px; font-weight: 750; }
      .lane-title { font-size: 20px; font-weight: 750; letter-spacing: 1px; }
      .heading { font-size: 19px; font-weight: 750; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .strong { font-weight: 700; }
      .muted { fill: #52606D; }
      .public-panel { fill: #F4FAFE; stroke: #0072B2; stroke-width: 2; }
      .private-panel { fill: #FCF7FB; stroke: #CC79A7; stroke-width: 2; }
      .planned-panel {
        fill: #F7F8FA;
        stroke: #7B8794;
        stroke-width: 2;
        stroke-dasharray: 8 6;
      }
      .node { fill: #FFFDF8; stroke: #8A94A0; stroke-width: 1.5; }
      .semantic { fill: #FFFDF8; stroke: #7B8794; stroke-width: 1.5; }
      .planning { fill: #FFFDF8; stroke: #7B8794; stroke-width: 1.5; }
      .backend { fill: #FFFDF8; stroke: #7B8794; stroke-width: 1.5; }
      .runtime { fill: #FFFDF8; stroke: #7B8794; stroke-width: 1.5; }
      .oracle { fill: #EEF2F5; stroke: #7B8794; stroke-width: 1.5; }
      .arrow {
        fill: none;
        stroke: #4B5563;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
      .planned-arrow {
        fill: none;
        stroke: #7B8794;
        stroke-width: 2;
        stroke-dasharray: 7 6;
        marker-end: url(#arrow);
      }
      .public-arrow { stroke: #0072B2; }
      .private-arrow { stroke: #A95F8F; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="898" rx="24"
        fill="#FFFDF8" stroke="#CBD2D9" stroke-width="2"/>
  <text x="48" y="58" class="title">Follow the compiler journey</text>
  <text x="48" y="91" class="body muted">
    Solid lanes exist today. The dashed lane marks the public boundary that remains planned.
  </text>

  <rect x="40" y="118" width="1120" height="230" rx="18" class="public-panel"/>
  <rect x="40" y="118" width="340" height="40" rx="18" fill="#DCEFFD"/>
  <rect x="40" y="138" width="340" height="20" fill="#DCEFFD"/>
  <text x="58" y="146" class="lane-title">PUBLIC TODAY · M3</text>

  <rect x="60" y="190" width="200" height="102" rx="12" class="node"/>
  <text x="76" y="219" class="heading">@sw.jit kernel</text>
  <text x="76" y="246" class="body">fixed vector add</text>
  <text x="76" y="272" class="small muted">restricted AST</text>

  <rect x="290" y="190" width="200" height="102" rx="12" class="semantic"/>
  <text x="306" y="219" class="heading">Swage MLIR</text>
  <text x="306" y="246" class="body">semantic module</text>
  <text x="306" y="272" class="small muted">one production IR</text>

  <rect x="520" y="190" width="210" height="102" rx="12" class="backend"/>
  <text x="536" y="219" class="heading">Standard lowering</text>
  <text x="536" y="246" class="body">gpu · nvvm · LLVM</text>
  <text x="536" y="272" class="small muted">exact GPU target</text>

  <rect x="760" y="190" width="150" height="102" rx="12" class="node"/>
  <text x="776" y="219" class="heading">PTX</text>
  <text x="776" y="246" class="body">LLVM NVPTX</text>
  <text x="776" y="272" class="small muted">internal output</text>

  <rect x="940" y="180" width="200" height="122" rx="12" class="runtime"/>
  <text x="956" y="210" class="heading">CUDA Driver</text>
  <text x="956" y="237" class="body">validated launch</text>
  <text x="956" y="264" class="body">current PyTorch</text>
  <text x="956" y="288" class="small muted">stream · no fallback</text>

  <path d="M 260 241 L 284 241" class="arrow public-arrow"/>
  <path d="M 490 241 L 514 241" class="arrow public-arrow"/>
  <path d="M 730 241 L 754 241" class="arrow public-arrow"/>
  <path d="M 910 241 L 934 241" class="arrow public-arrow"/>

  <text x="60" y="326" class="small muted">
    emit_mlir() stops after verified MLIR · launch() executes only fixed vector add
  </text>

  <rect x="40" y="378" width="1120" height="402" rx="18" class="private-panel"/>
  <rect x="40" y="378" width="540" height="40" rx="18" fill="#F7E2EF"/>
  <rect x="40" y="398" width="540" height="20" fill="#F7E2EF"/>
  <text x="58" y="406" class="lane-title">
    PRIVATE QUALIFICATION · M4 TO M8
  </text>

  <rect x="60" y="500" width="200" height="120" rx="12" class="node"/>
  <text x="76" y="530" class="heading">Canonical modules</text>
  <text x="76" y="557" class="body">sum · max · softmax</text>
  <text x="76" y="584" class="body">identity sum</text>
  <text x="76" y="608" class="small muted">private entry only</text>

  <rect x="290" y="500" width="200" height="120" rx="12" class="semantic"/>
  <text x="306" y="530" class="heading">Swage MLIR</text>
  <text x="306" y="557" class="body">segment meaning</text>
  <text x="306" y="584" class="body">no hardware IDs</text>
  <text x="306" y="608" class="small muted">source preserved</text>

  <rect x="530" y="435" width="220" height="118" rx="12" class="oracle"/>
  <text x="546" y="465" class="heading">M4 / M5 qualification</text>
  <text x="546" y="492" class="body">sum · max · softmax</text>
  <text x="546" y="519" class="body">two correctness paths</text>
  <text x="546" y="543" class="small muted">no planning policy</text>

  <rect x="770" y="420" width="190" height="80" rx="12" class="oracle"/>
  <text x="786" y="450" class="heading">CPU oracle</text>
  <text x="786" y="477" class="small muted">sequential lowering</text>

  <rect x="770" y="515" width="190" height="92" rx="12" class="backend"/>
  <text x="786" y="545" class="heading">GPU path</text>
  <text x="786" y="572" class="body">one CTA / segment</text>
  <text x="786" y="596" class="small muted">PTX · exact sm_*</text>

  <rect x="990" y="515" width="150" height="92" rx="12" class="runtime"/>
  <text x="1006" y="545" class="heading">GPU stream</text>
  <text x="1006" y="572" class="body">one-CTA work</text>
  <text x="1006" y="596" class="small muted">private launch</text>

  <rect x="530" y="625" width="220" height="120" rx="12" class="planning"/>
  <text x="546" y="655" class="heading">M6 planning only</text>
  <text x="546" y="682" class="body">classify identity sum</text>
  <text x="546" y="709" class="body">direct / split descriptors</text>
  <text x="546" y="733" class="small muted">no launch on its own</text>

  <rect x="770" y="625" width="190" height="120" rx="12" class="backend"/>
  <text x="786" y="655" class="heading">M7 / M8 execution</text>
  <text x="786" y="682" class="body">M7 direct mixed</text>
  <text x="786" y="709" class="body">M8 split tasks</text>
  <text x="786" y="733" class="small muted">identity sum only</text>

  <rect x="990" y="625" width="150" height="120" rx="12" class="runtime"/>
  <text x="1006" y="655" class="heading">GPU stream</text>
  <text x="1006" y="682" class="body">direct work</text>
  <text x="1006" y="709" class="body">partial CTAs</text>
  <text x="1006" y="733" class="small muted">merge CTAs last</text>

  <path d="M 260 560 L 284 560" class="arrow private-arrow"/>
  <path d="M 490 535 C 510 535, 510 494, 524 494"
        class="arrow private-arrow"/>
  <path d="M 490 585 C 510 585, 510 685, 524 685"
        class="arrow private-arrow"/>
  <path d="M 750 475 C 758 475, 758 460, 764 460"
        class="arrow private-arrow"/>
  <path d="M 750 515 C 758 515, 758 561, 764 561"
        class="arrow private-arrow"/>
  <path d="M 960 561 L 984 561" class="arrow private-arrow"/>
  <path d="M 750 685 L 764 685" class="arrow private-arrow"/>
  <path d="M 960 685 L 984 685" class="arrow private-arrow"/>

  <text x="60" y="765" class="small muted">
    M6 stops at planning · M7 and M8 provide private identity-sum execution
  </text>

  <rect x="40" y="812" width="1120" height="58" rx="16" class="planned-panel"/>
  <text x="62" y="848" class="lane-title muted">PLANNED</text>
  <text x="184" y="848" class="body">
    Public segment syntax and launch, then packing and persistent scheduling
  </text>
</svg>
