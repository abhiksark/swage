<!-- docs/assets/diagrams/segments-tasks-tiles.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 650" role="img"
  aria-labelledby="segments-tasks-tiles-title segments-tasks-tiles-description"
  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="segments-tasks-tiles-title">One segment becomes policy-bearing tasks and fixed GPU steps</title>
  <desc id="segments-tasks-tiles-description">A runtime-length segment keeps its meaning while qualification derives one or more ordered tasks executed by fixed warp or CTA steps.</desc>
  <defs>
    <marker id="segments-tasks-tiles-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636E"/>
    </marker>
  </defs>
  <rect data-role="canvas" x="0" y="0" width="1200" height="650" fill="#FFFDF8"/>
  <text x="48" y="54" font-size="32" font-weight="750" fill="#17212B" text-anchor="start">Segment -> Task -> Tile</text>
  <text x="48" y="84" font-size="18" font-weight="500" fill="#4B5563" text-anchor="start">Meaning, scheduling policy, and physical execution remain separate.</text>
  <rect x="45" y="120" width="340" height="460" rx="14" fill="#F5F3ED" stroke="#59636E" stroke-width="2"/>
  <text x="69" y="160" font-size="18" font-weight="750" fill="#4B5563" text-anchor="start">1  SEGMENT</text>
  <rect x="430" y="120" width="340" height="460" rx="14" fill="#F5F3ED" stroke="#59636E" stroke-width="2"/>
  <text x="454" y="160" font-size="18" font-weight="750" fill="#4B5563" text-anchor="start">2  TASK</text>
  <rect x="815" y="120" width="340" height="460" rx="14" fill="#F5F3ED" stroke="#59636E" stroke-width="2"/>
  <text x="839" y="160" font-size="18" font-weight="750" fill="#4B5563" text-anchor="start">3  TILE</text>
  <rect x="75" y="210" width="280" height="150" rx="14" fill="#FCE5DC" stroke="#A94500" stroke-width="2"/>
  <text x="215" y="252" font-size="18" font-weight="650" fill="#17212B" text-anchor="middle">one runtime-length</text>
  <text x="215" y="279" font-size="18" font-weight="650" fill="#17212B" text-anchor="middle">segment</text>
  <text x="215" y="306" font-size="18" font-weight="650" fill="#17212B" text-anchor="middle">logical dense slice</text>
  <text x="215" y="333" font-size="18" font-weight="650" fill="#17212B" text-anchor="middle">identity is an SSA value</text>
  <text x="215" y="410" font-size="16" font-weight="500" fill="#A94500" text-anchor="middle">semantic meaning</text>
  <text x="215" y="440" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">no GPU IDs</text>
  <text x="215" y="470" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">no runtime-sized register array</text>
  <rect x="460" y="190" width="280" height="104" rx="14" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <text x="600" y="232" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">one direct task</text>
  <text x="600" y="257" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">short or medium</text>
  <text x="600" y="282" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">admitted work</text>
  <text x="600" y="330" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">or</text>
  <rect x="460" y="360" width="280" height="130" rx="14" fill="#F7E2EF" stroke="#8E4775" stroke-width="2"/>
  <text x="600" y="400" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">ordered partial tasks</text>
  <text x="600" y="430" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">+ one merge task</text>
  <text x="600" y="460" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">for qualified split work</text>
  <text x="600" y="540" font-size="16" font-weight="500" fill="#8E4775" text-anchor="middle">task = policy-bearing work unit</text>
  <rect x="845" y="205" width="280" height="112" rx="14" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <text x="985" y="250" font-size="20" font-weight="750" fill="#17212B" text-anchor="middle">32-thread warp step</text>
  <text x="985" y="282" font-size="16" font-weight="500" fill="#00689D" text-anchor="middle">fixed physical shape</text>
  <rect x="845" y="365" width="280" height="112" rx="14" fill="#F7E2EF" stroke="#8E4775" stroke-width="2"/>
  <text x="985" y="410" font-size="20" font-weight="750" fill="#17212B" text-anchor="middle">128-thread CTA step</text>
  <text x="985" y="442" font-size="16" font-weight="500" fill="#8E4775" text-anchor="middle">fixed physical shape</text>
  <text x="985" y="525" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">a tile is an execution step</text>
  <line x1="385" y1="286" x2="420" y2="286" stroke="#59636E" stroke-width="3" marker-end="url(#segments-tasks-tiles-arrow)"/>
  <line x1="740" y1="242" x2="805" y2="242" stroke="#59636E" stroke-width="3" marker-end="url(#segments-tasks-tiles-arrow)"/>
  <line x1="740" y1="424" x2="805" y2="424" stroke="#59636E" stroke-width="3" marker-end="url(#segments-tasks-tiles-arrow)"/>
  <text x="600" y="620" font-size="18" font-weight="650" fill="#17212B" text-anchor="middle">One segment may require one task or several ordered tasks.</text>
</svg>
