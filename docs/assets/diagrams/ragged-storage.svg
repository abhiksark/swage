<!-- docs/assets/diagrams/ragged-storage.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 640" role="img"
  aria-labelledby="ragged-storage-title ragged-storage-description"
  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ragged-storage-title">Dense ragged storage with repeated offsets</title>
  <desc id="ragged-storage-description">Values stay dense while offsets define four half-open ranges, including one empty range created by repeated offsets.</desc>
  <defs>
    <marker id="ragged-storage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636E"/>
    </marker>
  </defs>
  <rect data-role="canvas" x="0" y="0" width="1200" height="640" fill="#FFFDF8"/>
  <text x="48" y="54" font-size="32" font-weight="750" fill="#17212B" text-anchor="start">Ragged storage</text>
  <text x="48" y="84" font-size="18" font-weight="500" fill="#4B5563" text-anchor="start">One values strip plus offsets reconstructs every logical segment.</text>
  <text x="74" y="146" font-size="20" font-weight="750" fill="#17212B" text-anchor="start">values</text>
  <rect x="210" y="112" width="120" height="74" rx="14" fill="#FCE5DC" stroke="#59636E" stroke-width="2"/>
  <text x="270" y="157" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">4.0</text>
  <text x="210" y="210" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">0</text>
  <rect x="345" y="112" width="120" height="74" rx="14" fill="#FCE5DC" stroke="#59636E" stroke-width="2"/>
  <text x="405" y="157" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">1.0</text>
  <text x="345" y="210" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">1</text>
  <rect x="480" y="112" width="120" height="74" rx="14" fill="#DCEFFD" stroke="#59636E" stroke-width="2"/>
  <text x="540" y="157" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">3.0</text>
  <text x="480" y="210" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">2</text>
  <rect x="615" y="112" width="120" height="74" rx="14" fill="#DCEFFD" stroke="#59636E" stroke-width="2"/>
  <text x="675" y="157" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">8.0</text>
  <text x="615" y="210" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">3</text>
  <rect x="750" y="112" width="120" height="74" rx="14" fill="#DCEFFD" stroke="#59636E" stroke-width="2"/>
  <text x="810" y="157" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">2.0</text>
  <text x="750" y="210" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">4</text>
  <rect x="885" y="112" width="120" height="74" rx="14" fill="#DDF4EB" stroke="#59636E" stroke-width="2"/>
  <text x="945" y="157" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">9.0</text>
  <text x="885" y="210" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">5</text>
  <text x="1020" y="210" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">6</text>
  <text x="74" y="284" font-size="20" font-weight="750" fill="#17212B" text-anchor="start">offsets</text>
  <rect x="250" y="246" width="92" height="64" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="296" y="286" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">0</text>
  <rect x="425" y="246" width="92" height="64" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="471" y="286" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">2</text>
  <rect x="600" y="246" width="92" height="64" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="646" y="286" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">2</text>
  <rect x="775" y="246" width="92" height="64" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="821" y="286" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">5</text>
  <rect x="950" y="246" width="92" height="64" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="996" y="286" font-size="18" font-weight="700" fill="#17212B" text-anchor="middle">6</text>
  <text x="250" y="340" font-size="18" font-weight="650" fill="#17212B" text-anchor="start">offsets = [0, 2, 2, 5, 6]</text>
  <rect x="60" y="390" width="225" height="116" rx="14" fill="#FCE5DC" stroke="#A94500" stroke-width="2"/>
  <text x="172" y="426" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">S0</text>
  <text x="172" y="458" font-size="20" font-weight="700" fill="#17212B" text-anchor="middle">[0, 2)</text>
  <text x="172" y="486" font-size="16" font-weight="500" fill="#A94500" text-anchor="middle">2 values</text>
  <rect x="345" y="390" width="225" height="116" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="457" y="426" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">S1</text>
  <text x="457" y="458" font-size="20" font-weight="700" fill="#17212B" text-anchor="middle">[2, 2)</text>
  <text x="457" y="486" font-size="16" font-weight="500" fill="#59636E" text-anchor="middle">empty segment</text>
  <rect x="630" y="390" width="225" height="116" rx="14" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <text x="742" y="426" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">S2</text>
  <text x="742" y="458" font-size="20" font-weight="700" fill="#17212B" text-anchor="middle">[2, 5)</text>
  <text x="742" y="486" font-size="16" font-weight="500" fill="#00689D" text-anchor="middle">3 values</text>
  <rect x="915" y="390" width="225" height="116" rx="14" fill="#DDF4EB" stroke="#00664B" stroke-width="2"/>
  <text x="1027" y="426" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">S3</text>
  <text x="1027" y="458" font-size="20" font-weight="700" fill="#17212B" text-anchor="middle">[5, 6)</text>
  <text x="1027" y="486" font-size="16" font-weight="500" fill="#00664B" text-anchor="middle">1 value</text>
  <text x="600" y="564" font-size="20" font-weight="650" fill="#17212B" text-anchor="middle">segment i = values[offsets[i] : offsets[i + 1]]  (half-open)</text>
  <text x="600" y="602" font-size="17" font-weight="500" fill="#4B5563" text-anchor="middle">Repeated offsets preserve dense storage and describe zero work.</text>
</svg>
