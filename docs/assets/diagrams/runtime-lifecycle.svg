<!-- docs/assets/diagrams/runtime-lifecycle.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 680" role="img"
  aria-labelledby="runtime-lifecycle-title runtime-lifecycle-description"
  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="runtime-lifecycle-title">Runtime validation, launch, and tensor retention lifecycle</title>
  <desc id="runtime-lifecycle-description">Validation precedes specialization, compilation, and allocation; work is enqueued on the current stream and tensors are retained.</desc>
  <defs>
    <marker id="runtime-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636E"/>
    </marker>
  </defs>
  <rect data-role="canvas" x="0" y="0" width="1200" height="680" fill="#FFFDF8"/>
  <text x="48" y="54" font-size="32" font-weight="750" fill="#17212B" text-anchor="start">Runtime lifecycle</text>
  <text x="48" y="84" font-size="18" font-weight="500" fill="#4B5563" text-anchor="start">Asynchronous launch with no synchronization or fallback.</text>
  <rect x="55" y="120" width="145" height="38" rx="19" fill="#FCE5DC" stroke="#A94500" stroke-width="2"/>
  <text x="127" y="146" font-size="16" font-weight="750" fill="#A94500" text-anchor="middle">VALIDATE</text>
  <rect x="55" y="172" width="220" height="138" rx="14" fill="#FCE5DC" stroke="#A94500" stroke-width="2"/>
  <text x="165" y="210" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">tensors / ABI</text>
  <text x="165" y="240" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">grid / device</text>
  <text x="165" y="270" font-size="16" font-weight="650" fill="#17212B" text-anchor="middle">before compile or allocation</text>
  <rect x="82" y="326" width="165" height="38" rx="19" fill="#FCE5DC" stroke="#A94500" stroke-width="2"/>
  <text x="164" y="352" font-size="16" font-weight="750" fill="#A94500" text-anchor="middle">FAIL CLOSED</text>
  <text x="165" y="392" font-size="16" font-weight="500" fill="#A94500" text-anchor="middle">invalid input stops</text>
  <rect x="330" y="172" width="220" height="138" rx="14" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <text x="440" y="214" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">specialize / cache</text>
  <text x="440" y="252" font-size="16" font-weight="500" fill="#00689D" text-anchor="middle">exact sm_*</text>
  <text x="440" y="280" font-size="16" font-weight="500" fill="#00689D" text-anchor="middle">verified reuse</text>
  <line x1="285" y1="241" x2="320" y2="241" stroke="#59636E" stroke-width="3" marker-end="url(#runtime-lifecycle-arrow)"/>
  <rect x="595" y="172" width="220" height="138" rx="14" fill="#F7E2EF" stroke="#8E4775" stroke-width="2"/>
  <text x="705" y="214" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">compile / load</text>
  <text x="705" y="252" font-size="16" font-weight="500" fill="#8E4775" text-anchor="middle">LLVM NVPTX</text>
  <text x="705" y="280" font-size="16" font-weight="500" fill="#8E4775" text-anchor="middle">CUDA Driver</text>
  <line x1="550" y1="241" x2="585" y2="241" stroke="#59636E" stroke-width="3" marker-end="url(#runtime-lifecycle-arrow)"/>
  <rect x="860" y="172" width="220" height="138" rx="14" fill="#DDF4EB" stroke="#00664B" stroke-width="2"/>
  <text x="970" y="214" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">enqueue</text>
  <text x="970" y="252" font-size="16" font-weight="500" fill="#00664B" text-anchor="middle">current PyTorch stream</text>
  <text x="970" y="280" font-size="16" font-weight="500" fill="#00664B" text-anchor="middle">asynchronous</text>
  <line x1="815" y1="241" x2="850" y2="241" stroke="#59636E" stroke-width="3" marker-end="url(#runtime-lifecycle-arrow)"/>
  <rect x="55" y="430" width="220" height="78" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="165" y="463" font-size="18" font-weight="750" fill="#17212B" text-anchor="middle">n == 0</text>
  <text x="165" y="491" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">zero-work no-op</text>
  <line x1="275" y1="469" x2="320" y2="469" stroke="#59636E" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#runtime-lifecycle-arrow)"/>
  <text x="330" y="475" font-size="16" font-weight="500" fill="#4B5563" text-anchor="start">returns before specialization</text>
  <line x1="970" y1="310" x2="920" y2="380" stroke="#59636E" stroke-width="3" marker-end="url(#runtime-lifecycle-arrow)"/>
  <rect x="690" y="400" width="460" height="122" rx="14" fill="#DDF4EB" stroke="#00664B" stroke-width="2"/>
  <text x="920" y="440" font-size="20" font-weight="750" fill="#17212B" text-anchor="middle">retain submitted tensors</text>
  <text x="920" y="475" font-size="18" font-weight="500" fill="#00664B" text-anchor="middle">record_stream() on the launch stream</text>
  <text x="920" y="505" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">storage stays owned by PyTorch</text>
  <text x="600" y="600" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">No copy, cast, device change, context creation, synchronization or fallback.</text>
  <text x="600" y="638" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">Cache or driver integrity failures stop instead of selecting another backend.</text>
</svg>
