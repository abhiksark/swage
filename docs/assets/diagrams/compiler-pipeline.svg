<!-- docs/assets/diagrams/compiler-pipeline.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 790" role="img"
  aria-labelledby="compiler-pipeline-title compiler-pipeline-description"
  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="compiler-pipeline-title">Swage compiler pipeline</title>
  <desc id="compiler-pipeline-description">Verified semantic MLIR enters one of three admitted current branches before rejoining upstream MLIR, LLVM NVPTX, PTX, and CUDA.</desc>
  <defs>
    <marker id="compiler-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636E"/>
    </marker>
  </defs>
  <rect data-role="canvas" x="0" y="0" width="1200" height="790" fill="#FFFDF8"/>
  <text x="48" y="54" font-size="32" font-weight="750" fill="#17212B" text-anchor="start">One compiler spine, three admitted branches</text>
  <rect x="390" y="92" width="420" height="76" rx="14" fill="#FCE5DC" stroke="#A94500" stroke-width="2"/>
  <text x="600" y="139" font-size="22" font-weight="750" fill="#17212B" text-anchor="middle">verified semantic MLIR</text>
  <line x1="600" y1="168" x2="600" y2="215" stroke="#59636E" stroke-width="3"/>
  <rect x="55" y="245" width="330" height="220" rx="14" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <rect x="77" y="265" width="180" height="38" rx="19" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <text x="167" y="291" font-size="16" font-weight="750" fill="#00689D" text-anchor="middle">PUBLIC M3</text>
  <text x="220" y="344" font-size="19" font-weight="750" fill="#17212B" text-anchor="middle">M3 fixed block</text>
  <text x="220" y="384" font-size="16" font-weight="500" fill="#00689D" text-anchor="middle">canonical vector add</text>
  <text x="220" y="414" font-size="16" font-weight="500" fill="#00689D" text-anchor="middle">fixed-block GPU conversion</text>
  <rect x="420" y="245" width="330" height="220" rx="14" fill="#F7E2EF" stroke="#8E4775" stroke-width="2"/>
  <rect x="442" y="265" width="180" height="38" rx="19" fill="#F7E2EF" stroke="#8E4775" stroke-width="2"/>
  <text x="532" y="291" font-size="16" font-weight="750" fill="#8E4775" text-anchor="middle">PRIVATE M4-M5</text>
  <text x="585" y="344" font-size="19" font-weight="750" fill="#17212B" text-anchor="middle">M4 / M5 segmented direct</text>
  <text x="585" y="384" font-size="16" font-weight="500" fill="#8E4775" text-anchor="middle">CPU oracle or one CTA / segment</text>
  <text x="585" y="414" font-size="16" font-weight="500" fill="#8E4775" text-anchor="middle">sum, max, stable softmax</text>
  <rect x="785" y="245" width="330" height="220" rx="14" fill="#DDF4EB" stroke="#00664B" stroke-width="2"/>
  <rect x="807" y="265" width="180" height="38" rx="19" fill="#DDF4EB" stroke="#00664B" stroke-width="2"/>
  <text x="897" y="291" font-size="16" font-weight="750" fill="#00664B" text-anchor="middle">PRIVATE M6-M8</text>
  <text x="950" y="344" font-size="19" font-weight="750" fill="#17212B" text-anchor="middle">M6-M8 SwagePlan</text>
  <text x="950" y="384" font-size="16" font-weight="500" fill="#00664B" text-anchor="middle">classification companion</text>
  <text x="950" y="414" font-size="16" font-weight="500" fill="#00664B" text-anchor="middle">direct or split identity sum</text>
  <line x1="600" y1="215" x2="220" y2="235" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="600" y1="215" x2="585" y2="235" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="600" y1="215" x2="950" y2="235" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="220" y1="465" x2="500" y2="530" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="585" y1="465" x2="600" y2="530" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="950" y1="465" x2="700" y2="530" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <rect x="330" y="545" width="540" height="78" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="600" y="578" font-size="22" font-weight="750" fill="#17212B" text-anchor="middle">GPU / SCF / NVVM / LLVM</text>
  <text x="600" y="605" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">upstream MLIR and LLVM paths</text>
  <line x1="600" y1="623" x2="310" y2="664" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <rect x="210" y="674" width="200" height="68" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="310" y="716" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">LLVM NVPTX</text>
  <rect x="500" y="674" width="200" height="68" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="600" y="716" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">PTX</text>
  <rect x="790" y="674" width="200" height="68" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="890" y="716" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">CUDA Driver API</text>
  <line x1="410" y1="708" x2="490" y2="708" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="700" y1="708" x2="780" y2="708" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <text x="600" y="770" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">No second production IR and no silent backend fallback.</text>
</svg>
