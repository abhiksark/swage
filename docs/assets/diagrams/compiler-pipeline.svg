<!-- docs/assets/diagrams/compiler-pipeline.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 850" role="img"
  aria-labelledby="compiler-pipeline-title compiler-pipeline-description"
  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="compiler-pipeline-title">Swage compiler pipeline</title>
  <desc id="compiler-pipeline-description">Verified semantic MLIR enters two admitted branches. The public fixed-block branch admits canonical vector add or multiply and lowers it for the selected backend: to a Native LLVM JIT host call, or through GPU, NVVM, and LLVM to NVPTX, PTX, and the CUDA Driver API. The private SwagePlan stage plans every segment function. Its GPU kernels each carry a swage.kernel_contract and rejoin the CUDA path, and its sequential CPU oracle stops at SCF and memref. The public segment_reduce and segment_softmax calls run through the SwagePlan stage.</desc>
  <defs>
    <marker id="compiler-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636E"/>
    </marker>
  </defs>
  <rect data-role="canvas" x="0" y="0" width="1200" height="850" fill="#FFFDF8"/>
  <text x="48" y="54" font-size="32" font-weight="750" fill="#17212B" text-anchor="start">One compiler spine, two admitted branches</text>
  <rect x="390" y="92" width="420" height="76" rx="14" fill="#FCE5DC" stroke="#A94500" stroke-width="2"/>
  <text x="600" y="139" font-size="22" font-weight="750" fill="#17212B" text-anchor="middle">verified semantic MLIR</text>
  <line x1="600" y1="168" x2="600" y2="215" stroke="#59636E" stroke-width="3"/>
  <rect x="55" y="245" width="500" height="180" rx="14" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <rect x="77" y="265" width="250" height="38" rx="19" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <text x="202" y="291" font-size="16" font-weight="750" fill="#00689D" text-anchor="middle">PUBLIC TODAY</text>
  <text x="305" y="344" font-size="19" font-weight="750" fill="#17212B" text-anchor="middle">fixed-block add / multiply</text>
  <text x="305" y="384" font-size="16" font-weight="500" fill="#00689D" text-anchor="middle">one fixed admission</text>
  <text x="305" y="414" font-size="16" font-weight="500" fill="#00689D" text-anchor="middle">selected cpu or cuda backend</text>
  <rect x="645" y="245" width="500" height="180" rx="14" fill="#DDF4EB" stroke="#00664B" stroke-width="2"/>
  <rect x="667" y="265" width="250" height="38" rx="19" fill="#DDF4EB" stroke="#00664B" stroke-width="2"/>
  <text x="792" y="291" font-size="16" font-weight="750" fill="#00664B" text-anchor="middle">PRIVATE QUALIFICATION</text>
  <text x="895" y="344" font-size="19" font-weight="750" fill="#17212B" text-anchor="middle">SwagePlan stage</text>
  <text x="895" y="384" font-size="16" font-weight="500" fill="#00664B" text-anchor="middle">one plan per segment function</text>
  <text x="895" y="414" font-size="16" font-weight="500" fill="#00664B" text-anchor="middle">runs segment_reduce and segment_softmax</text>
  <line x1="600" y1="215" x2="305" y2="235" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="600" y1="215" x2="895" y2="235" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="895" y1="425" x2="770" y2="435" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="895" y1="425" x2="1020" y2="435" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <rect x="655" y="445" width="230" height="105" rx="14" fill="#FFFDF8" stroke="#00664B" stroke-width="2"/>
  <text x="770" y="480" font-size="16" font-weight="650" fill="#00664B" text-anchor="middle">plan to SCF</text>
  <text x="770" y="507" font-size="16" font-weight="650" fill="#00664B" text-anchor="middle">sequential CPU oracle</text>
  <text x="770" y="534" font-size="16" font-weight="650" fill="#00664B" text-anchor="middle">SCF / memref stop</text>
  <rect x="905" y="445" width="230" height="105" rx="14" fill="#FFFDF8" stroke="#00664B" stroke-width="2"/>
  <text x="1020" y="480" font-size="16" font-weight="650" fill="#00664B" text-anchor="middle">plan to GPU</text>
  <text x="1020" y="507" font-size="16" font-weight="650" fill="#00664B" text-anchor="middle">kernels, each with a</text>
  <text x="1020" y="534" font-size="16" font-weight="650" fill="#00664B" text-anchor="middle">swage.kernel_contract</text>
  <line x1="305" y1="425" x2="420" y2="565" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="1020" y1="550" x2="800" y2="565" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <rect x="300" y="580" width="600" height="78" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="600" y="613" font-size="22" font-weight="750" fill="#17212B" text-anchor="middle">backend-specific MLIR / LLVM lowering</text>
  <text x="600" y="640" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">Native: SCF / LLVM | CUDA: GPU / NVVM / LLVM</text>
  <line x1="600" y1="658" x2="225" y2="690" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <rect x="85" y="700" width="280" height="68" rx="14" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <text x="225" y="742" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">Native LLVM JIT</text>
  <line x1="600" y1="658" x2="515" y2="690" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <rect x="415" y="700" width="200" height="68" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="515" y="742" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">LLVM NVPTX</text>
  <rect x="665" y="700" width="200" height="68" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="765" y="742" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">PTX</text>
  <rect x="915" y="700" width="200" height="68" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="1015" y="742" font-size="17" font-weight="700" fill="#17212B" text-anchor="middle">CUDA Driver API</text>
  <line x1="615" y1="734" x2="655" y2="734" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <line x1="865" y1="734" x2="905" y2="734" stroke="#59636E" stroke-width="3" marker-end="url(#compiler-pipeline-arrow)"/>
  <text x="600" y="818" font-size="16" font-weight="500" fill="#4B5563" text-anchor="middle">No second production IR and no silent backend fallback.</text>
</svg>
