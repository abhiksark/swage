<!-- docs/assets/diagrams/capability-boundary.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 650" role="img"
  aria-labelledby="capability-boundary-title capability-boundary-description"
  font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="capability-boundary-title">Swage capability boundary</title>
  <desc id="capability-boundary-description">Three separate lanes distinguish the public fixed vector-add surface, private segmented qualification, and planned segmented APIs.</desc>
  <defs>
    <marker id="capability-boundary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636E"/>
    </marker>
  </defs>
  <rect data-role="canvas" x="0" y="0" width="1200" height="650" fill="#FFFDF8"/>
  <text x="48" y="54" font-size="32" font-weight="750" fill="#17212B" text-anchor="start">Capability boundary</text>
  <text x="48" y="84" font-size="18" font-weight="500" fill="#4B5563" text-anchor="start">The lanes describe status; none is a fallback from another.</text>
  <rect x="40" y="120" width="1120" height="138" rx="14" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <rect x="62" y="138" width="250" height="38" rx="19" fill="#DCEFFD" stroke="#00689D" stroke-width="2"/>
  <text x="187" y="164" font-size="16" font-weight="750" fill="#00689D" text-anchor="middle">PUBLIC TODAY</text>
  <rect x="350" y="144" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#00689D" stroke-width="2"/>
  <text x="452" y="183" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">Python capture</text>
  <rect x="595" y="144" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#00689D" stroke-width="2"/>
  <text x="697" y="183" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">emit_mlir()</text>
  <line x1="561" y1="176" x2="587" y2="176" stroke="#59636E" stroke-width="3" marker-end="url(#capability-boundary-arrow)"/>
  <rect x="840" y="144" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#00689D" stroke-width="2"/>
  <text x="942" y="183" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">launch()</text>
  <line x1="806" y1="176" x2="832" y2="176" stroke="#59636E" stroke-width="3" marker-end="url(#capability-boundary-arrow)"/>
  <text x="350" y="236" font-size="16" font-weight="650" fill="#00689D" text-anchor="start">canonical fixed vector add only</text>
  <rect x="40" y="300" width="1120" height="138" rx="14" fill="#F7E2EF" stroke="#8E4775" stroke-width="2"/>
  <rect x="62" y="318" width="250" height="38" rx="19" fill="#F7E2EF" stroke="#8E4775" stroke-width="2"/>
  <text x="187" y="344" font-size="16" font-weight="750" fill="#8E4775" text-anchor="middle">PRIVATE QUALIFICATION</text>
  <rect x="350" y="324" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#8E4775" stroke-width="2"/>
  <text x="452" y="363" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">segment semantics</text>
  <rect x="595" y="324" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#8E4775" stroke-width="2"/>
  <text x="697" y="363" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">planning + split</text>
  <line x1="561" y1="356" x2="587" y2="356" stroke="#59636E" stroke-width="3" marker-end="url(#capability-boundary-arrow)"/>
  <rect x="840" y="324" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#8E4775" stroke-width="2"/>
  <text x="942" y="363" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">GPU evidence</text>
  <line x1="806" y1="356" x2="832" y2="356" stroke="#59636E" stroke-width="3" marker-end="url(#capability-boundary-arrow)"/>
  <text x="350" y="416" font-size="16" font-weight="650" fill="#8E4775" text-anchor="start">not a public API</text>
  <rect x="40" y="480" width="1120" height="138" rx="14" fill="#EEF0F2" stroke="#59636E" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="62" y="498" width="250" height="38" rx="19" fill="#EEF0F2" stroke="#59636E" stroke-width="2"/>
  <text x="187" y="524" font-size="16" font-weight="750" fill="#59636E" text-anchor="middle">PLANNED</text>
  <rect x="350" y="504" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="452" y="543" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">public segmented API</text>
  <rect x="595" y="504" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="697" y="543" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">packed work</text>
  <line x1="561" y1="536" x2="587" y2="536" stroke="#59636E" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#capability-boundary-arrow)"/>
  <rect x="840" y="504" width="205" height="64" rx="14" fill="#FFFDF8" stroke="#59636E" stroke-width="2"/>
  <text x="942" y="543" font-size="17" font-weight="650" fill="#17212B" text-anchor="middle">split max / softmax</text>
  <line x1="806" y1="536" x2="832" y2="536" stroke="#59636E" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#capability-boundary-arrow)"/>
  <text x="350" y="596" font-size="16" font-weight="650" fill="#59636E" text-anchor="start">persistent scheduling</text>
