# pyproject.toml

[build-system]
requires = ["scikit-build-core==1.0.3", "nanobind==2.15.0"]
build-backend = "scikit_build_core.build"

[project]
name = "swage-compiler"
dynamic = ["version"]
description = "MLIR/LLVM fixed vector-add compiler with explicit CPU and CUDA backends"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT AND Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE", "LICENSES/LLVM.txt"]
authors = [{ name = "Abhik Sarkar", email = "abhiksark@gmail.com" }]
keywords = ["mlir", "llvm", "gpu", "compiler", "cuda", "ragged", "segments"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/abhiksark/swage"

[project.optional-dependencies]
dev = [
  "build", "scikit-build-core==1.0.3", "lit", "pytest", "ruff",
  "nanobind==2.15.0",
  "mypy", "twine", "auditwheel", "pyelftools",
]
docs = ["mkdocs", "mkdocs-material"]
figures = ["pymupdf"]
pytorch = ["torch>=2.6,<3"]

[tool.scikit-build]
minimum-version = "1.0.3"
wheel.packages = ["python/swage"]
wheel.platlib = true
wheel.reproducible = true
# Extensions need the versioned SONAME, not its duplicate development symlink.
wheel.exclude = [
  "swage/_segmented*.py", "**/__pycache__/**", "**/*.pyc",
  "mlir_swage/_mlir_libs/libSwagePythonCAPI.so",
]
cmake.build-type = "Release"
build.targets = ["SwagePythonModules"]
install.components = ["SwagePythonModules"]
install.strip = true
sdist.cmake = false
sdist.reproducible = true
sdist.inclusion-mode = "explicit"
sdist.include = [
  "/CMakeLists.txt", "/cmake/**", "/include/**", "/lib/**", "/python/**",
  "/tools/**", "/test/**", "/unittests/**", "/tests/**", "/scripts/**",
  "/examples/**", "/benchmarks/*.py", "/LICENSE", "/LICENSES/**", "/README.md",
  "/pyproject.toml",
]
sdist.exclude = [
  "**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**",
  "**/CMakeFiles/**", "**/.benchmarks/**", "**/*.egg-info/**",
]

[tool.scikit-build.cmake.define]
SWAGE_WHEEL_BUILD = "ON"
SWAGE_PYTHON_BINDINGS = "ON"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "python/swage/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 80
target-version = "py310"
extend-exclude = ["build", "test/lit.cfg.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
