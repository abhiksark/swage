# mkdocs.yml

site_name: Swage
site_description: Turn variable-sized dense segments into efficient GPU tile tasks
site_url: !ENV READTHEDOCS_CANONICAL_URL
repo_url: https://github.com/abhiksark/swage
theme:
  name: material
  logo: assets/images/swage-icon.png
  favicon: assets/images/swage-favicon.png
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
plugins:
  - search
hooks:
  - scripts/mkdocs_redirect_pages.py
extra_css:
  - stylesheets/figures.css
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Troubleshooting: getting-started/troubleshooting.md
  - User guide:
      - user-guide/index.md
      - Ragged Data: user-guide/ragged-data.md
      - Writing Kernels: user-guide/writing-kernels.md
      - Launching Kernels: user-guide/launching.md
      - Execution Model: user-guide/execution-model.md
  - API reference:
      - reference/index.md
      - swage: reference/swage.md
      - swage.language: reference/swage-language.md
      - Kernel Language: reference/kernel-language.md
      - Runtime and Environment: reference/runtime-environment.md
  - Internals:
      - internals/index.md
      - Compiler Pipeline: internals/compiler-pipeline.md
      - Swage Dialect: internals/swage-dialect.md
      - Segmented Reductions: internals/segmented-reductions.md
      - Ragged Softmax: internals/ragged-softmax.md
      - Task Planning: internals/planning.md
      - Task Execution: internals/task-execution.md
      - Split Execution: internals/split-execution.md
      - SwagePlan Dialect: internals/swage-plan-dialect.md
      - Compiler Tools and Passes: internals/compiler-tools.md
      - Verification: internals/verification.md
      - Benchmarks: internals/benchmarks.md
  - Decisions:
      - ADR Index: decisions/index.md
      - "ADR-0001: Python AST directly to MLIR": adr/ADR-0001-python-ast-directly-to-mlir.md
      - "ADR-0002: Segment/Task/Tile terminology": adr/ADR-0002-segment-task-tile-terminology.md
      - "ADR-0003: Two dialects": adr/ADR-0003-two-dialects.md
      - "ADR-0004: LLVM pin": adr/ADR-0004-llvm-pin.md
      - "ADR-0005: No prototype, PyTorch oracle": adr/ADR-0005-no-prototype-pytorch-oracle.md
      - "ADR-0006: PTX via LLVM NVPTX": adr/ADR-0006-ptx-via-llvm-nvptx.md
      - "ADR-0007: Distribution naming": adr/ADR-0007-distribution-naming.md
      - "ADR-0008: Region ops": adr/ADR-0008-region-ops-isolation-and-kinds.md
      - "ADR-0009: Python bindings": adr/ADR-0009-python-bindings-package-and-ci.md
      - "ADR-0010: Fixed-block MLIR": adr/ADR-0010-fixed-block-mlir-boundary.md
      - "ADR-0011: PyTorch metadata inference": adr/ADR-0011-pytorch-metadata-inference.md
      - "ADR-0012: M3 launch ABI": adr/ADR-0012-m3-launch-abi-and-execution-boundary.md
      - "ADR-0013: M5 fusion and map-store ABI": adr/ADR-0013-m5-fusion-and-map-store-abi.md
      - "ADR-0014: M6 minimal SwagePlan gate": adr/ADR-0014-m6-minimal-swage-plan-gate.md
      - "ADR-0015: M7 mixed-policy execution": adr/ADR-0015-m7-minimal-mixed-policy-execution.md
      - "ADR-0016: M7 fused mixed-policy schedule": adr/ADR-0016-m7-fused-mixed-policy-schedule.md
      - "ADR-0017: M8 private split-CTA reductions": adr/ADR-0017-m8-private-split-cta-reductions.md
